apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  labels:
    app: nginx-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      automountServiceAccountToken: false

      containers:
        - name: nginx
          image: nginx:stable-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo

spec:
  selector:
    app: nginx-demo

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
